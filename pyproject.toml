[project]
name = "securepay-generator"
version = "0.1.0"
description = "Simulated wallet core that streams transactions with labeled fraud patterns for SecurePay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "securepay-shared>=0.1.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/securepay_generator"]

[tool.ruff]
# Linter and formatter, same rules as SecurePay. CI runs "ruff check ." and
# "ruff format --check ."; "ruff check --fix ." and "ruff format ." fix most
# of it locally.
target-version = "py312"

[tool.ruff.lint]
# pycodestyle (E, W), real errors (F), import order (I), Python 3.12 syntax
# (UP) and likely bugs (bugbear, B).
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length: left to the formatter
    "UP042",  # StrEnum changes what str() of a member returns
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
